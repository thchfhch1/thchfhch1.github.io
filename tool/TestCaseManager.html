<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>洛谷数据测试点配置生成器</title>
    <!-- SortableJS -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js">
    </script>
    <style>
        /* ===== 全局重置 ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .app {
            max-width: 1100px;
            width: 100%;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 20, 40, 0.12);
            padding: 32px 36px 40px;
            transition: box-shadow 0.25s;
        }
        @media (max-width: 640px) {
            .app {
                padding: 20px 16px 28px;
                border-radius: 16px;
            }
        }

        /* ===== 头部 ===== */
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .header h1 {
            font-size: 26px;
            font-weight: 700;
            color: #1a2b3c;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header h1 small {
            font-size: 15px;
            font-weight: 400;
            color: #6b7a8a;
            margin-left: 4px;
        }
        .header .badge {
            background: #eef3f9;
            color: #2c6b9e;
            font-size: 13px;
            font-weight: 500;
            padding: 4px 14px;
            border-radius: 20px;
            margin-left: auto;
            white-space: nowrap;
        }
        @media (max-width: 640px) {
            .header h1 {
                font-size: 20px;
                flex-wrap: wrap;
            }
            .header .badge {
                margin-left: 0;
                width: 100%;
                text-align: center;
                margin-top: 6px;
            }
        }

        /* ===== 全局设置 ===== */
        .global-settings {
            background: #f7faff;
            border-radius: 16px;
            padding: 16px 20px 20px;
            margin-bottom: 20px;
            border: 1px solid #e6edf6;
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 16px 24px;
        }
        .global-settings .setting-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 0 1 auto;
            min-width: 120px;
        }
        .global-settings .setting-group label {
            font-size: 13px;
            font-weight: 500;
            color: #3e4e5e;
        }
        .global-settings .setting-group input {
            padding: 8px 12px;
            border: 1.5px solid #d4dee8;
            border-radius: 10px;
            font-size: 14px;
            background: #ffffff;
            height: 40px;
            outline: none;
            transition: border-color 0.2s;
            width: 100%;
            font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
        }
        .global-settings .setting-group input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
        }
        .global-settings .setting-group input[type="number"] {
            -moz-appearance: textfield;
            font-family: 'Segoe UI', 'PingFang SC', sans-serif;
        }
        .global-settings .setting-group input[type="number"]::-webkit-outer-spin-button,
        .global-settings .setting-group input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
        }
        .global-settings .setting-group.name-format-group {
            flex: 2 1 320px;
        }

        /* 格式说明与预览 */
        .format-hint {
            font-size: 12px;
            color: #8a9aa8;
            margin-top: 6px;
            line-height: 1.6;
        }
        .format-hint code {
            background: #eef3f9;
            color: #2563eb;
            padding: 1px 6px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 11.5px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .format-hint code:hover {
            background: #dbeafe;
        }

        .format-preview {
            margin-top: 8px;
            background: #ffffff;
            border: 1px dashed #d4dee8;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 12.5px;
            color: #4a5a6a;
            font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
            line-height: 1.7;
            min-height: 38px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px 16px;
            align-items: center;
        }
        .format-preview .preview-item {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .format-preview .preview-item .label {
            color: #8a9aa8;
            font-family: 'Segoe UI', sans-serif;
            font-size: 11.5px;
        }
        .format-preview .preview-item .val {
            color: #1a2b3c;
            font-weight: 600;
        }
        .format-preview .preview-item .val.out {
            color: #6b7a8a;
            font-weight: 500;
        }

        /* ===== 添加表单 ===== */
        .form-card {
            background: #f7faff;
            border-radius: 16px;
            padding: 18px 22px 22px;
            margin-bottom: 24px;
            border: 1px solid #e6edf6;
        }
        .form-card .form-title {
            font-size: 15px;
            font-weight: 600;
            color: #1a2b3c;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .form-card .form-title span {
            color: #6b7a8a;
            font-weight: 400;
            font-size: 13px;
        }
        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 14px;
            align-items: flex-end;
        }
        .form-group {
            flex: 1 1 80px;
            min-width: 70px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .form-group label {
            font-size: 13px;
            font-weight: 500;
            color: #3e4e5e;
        }
        .form-group label .unit {
            font-weight: 400;
            color: #8a9aa8;
            font-size: 12px;
        }
        .form-group input {
            padding: 8px 12px;
            border: 1.5px solid #d4dee8;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            color: #1a2b3c;
            background: #ffffff;
            height: 44px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            width: 100%;
        }
        .form-group input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
        }
        .form-group input::placeholder {
            color: #b0c0ce;
            font-weight: 400;
        }
        .form-group input[type="number"] {
            -moz-appearance: textfield;
        }
        .form-group input[type="number"]::-webkit-outer-spin-button,
        .form-group input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
        }

        .btn-add {
            flex: 0 0 auto;
            height: 44px;
            padding: 0 28px;
            background: #3b82f6;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            margin-top: 6px;
        }
        .btn-add:hover {
            background: #2563eb;
        }
        .btn-add:active {
            transform: scale(0.97);
        }

        @media (max-width: 700px) {
            .form-row {
                gap: 10px;
            }
            .form-group {
                flex: 1 1 calc(50% - 10px);
                min-width: 60px;
            }
            .btn-add {
                flex: 1 1 100%;
                justify-content: center;
                margin-top: 4px;
            }
        }

        /* ===== 任务列表 ===== */
        .list-section {
            margin-top: 4px;
        }
        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .list-header .count {
            font-size: 14px;
            color: #4a5a6a;
            font-weight: 500;
        }
        .list-header .count strong {
            color: #1a2b3c;
            font-size: 17px;
        }
        .list-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn-outline {
            padding: 6px 18px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            border: 1.5px solid #d4dee8;
            background: transparent;
            color: #3e4e5e;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            height: 36px;
        }
        .btn-outline:hover {
            background: #f1f6fc;
            border-color: #b0c4d8;
        }
        .btn-outline.danger:hover {
            background: #fef2f2;
            border-color: #fca5a5;
            color: #b91c1c;
        }
        .btn-primary {
            padding: 6px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            background: #3b82f6;
            color: #fff;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            height: 36px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary:hover {
            background: #2563eb;
        }
        .btn-primary:active {
            transform: scale(0.97);
        }
        .btn-success {
            background: #16a34a;
        }
        .btn-success:hover {
            background: #15803d;
        }

        .table-wrap {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid #e6edf6;
            background: #fafcff;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            min-width: 600px;
        }
        thead {
            background: #eef4fa;
        }
        th {
            padding: 12px 14px;
            text-align: left;
            font-weight: 600;
            color: #2c3e50;
            font-size: 13px;
            border-bottom: 1px solid #dce6f0;
            white-space: nowrap;
        }
        td {
            padding: 12px 14px;
            border-bottom: 1px solid #eef3f8;
            color: #1a2b3c;
            vertical-align: middle;
        }
        tr:last-child td {
            border-bottom: none;
        }
        tr:hover td {
            background: #f4f9ff;
        }
        .col-id {
            text-align: center;
            font-weight: 500;
            color: #4a5a6a;
            width: 30px;
        }
        .col-drag {
            text-align: center;
            width: 30px;
            cursor: grab;
            color: #b0c4d8;
            user-select: none;
            font-size: 18px;
        }
        .col-actions {
            text-align: center;
            width: 90px;
            white-space: nowrap;
        }
        .btn-icon {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 17px;
            padding: 4px 6px;
            border-radius: 6px;
            transition: background 0.2s, color 0.2s;
            color: #6b7a8a;
        }
        .btn-icon:hover {
            background: #eef3f8;
            color: #1a2b3c;
        }
        .btn-icon.danger:hover {
            background: #fef2f2;
            color: #dc2626;
        }
        .btn-icon.edit:hover {
            background: #eff6ff;
            color: #2563eb;
        }
        .empty-row td {
            text-align: center;
            color: #9aabb8;
            padding: 40px 14px;
            font-size: 15px;
        }
        .cell-fname {
            font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 12.5px;
            color: #2563eb;
            background: #eff6ff;
            padding: 2px 8px;
            border-radius: 4px;
            display: inline-block;
            max-width: 240px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            vertical-align: middle;
        }
        .cell-range {
            font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 12.5px;
            color: #4a5a6a;
        }

        /* ===== 预览 ===== */
        .preview-section {
            margin-top: 24px;
            border-top: 2px dashed #e6edf6;
            padding-top: 22px;
        }
        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 12px;
        }
        .preview-header .label {
            font-size: 15px;
            font-weight: 600;
            color: #1a2b3c;
        }
        .preview-header .label span {
            font-weight: 400;
            color: #6b7a8a;
            font-size: 13px;
        }
        .preview-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        textarea {
            width: 100%;
            height: 280px;
            padding: 16px 18px;
            border: 1px solid #d4dee8;
            border-radius: 12px;
            font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 13px;
            line-height: 1.7;
            color: #1a2b3c;
            background: #fafdff;
            resize: vertical;
            transition: border-color 0.2s;
            outline: none;
            tab-size: 2;
        }
        textarea:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.08);
        }
        textarea::placeholder {
            color: #b8c8d6;
        }

        .hidden {
            display: none !important;
        }

        /* ===== 右上角悬浮通知 ===== */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
            max-width: 380px;
            width: calc(100% - 40px);
        }
        .toast-item {
            background: #ffffff;
            border-radius: 12px;
            padding: 14px 16px 14px 14px;
            box-shadow: 0 10px 40px rgba(0, 20, 40, 0.18), 0 2px 8px rgba(0, 20, 40, 0.08);
            display: flex;
            align-items: flex-start;
            gap: 10px;
            pointer-events: auto;
            border-left: 4px solid #3b82f6;
            animation: toastIn 0.3s cubic-bezier(0.21, 1.02, 0.73, 1);
            transition: opacity 0.25s, transform 0.25s;
            opacity: 1;
            transform: translateX(0);
        }
        .toast-item.removing {
            opacity: 0;
            transform: translateX(30px);
        }
        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(40px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }
        .toast-item .toast-icon {
            font-size: 18px;
            line-height: 1.4;
            flex-shrink: 0;
            width: 22px;
            text-align: center;
        }
        .toast-item .toast-body {
            flex: 1;
            min-width: 0;
        }
        .toast-item .toast-title {
            font-size: 13.5px;
            font-weight: 700;
            color: #1a2b3c;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .toast-item .toast-text {
            font-size: 13px;
            color: #4a5a6a;
            line-height: 1.5;
            word-break: break-word;
        }
        .toast-item .toast-close {
            background: none;
            border: none;
            color: #b0c4d8;
            font-size: 18px;
            cursor: pointer;
            padding: 0 2px;
            line-height: 1;
            flex-shrink: 0;
            transition: color 0.2s;
            margin-top: -2px;
        }
        .toast-item .toast-close:hover {
            color: #4a5a6a;
        }
        /* 类型颜色 */
        .toast-item.success {
            border-left-color: #16a34a;
        }
        .toast-item.success .toast-icon {
            color: #16a34a;
        }
        .toast-item.error {
            border-left-color: #dc2626;
        }
        .toast-item.error .toast-icon {
            color: #dc2626;
        }
        .toast-item.warning {
            border-left-color: #f59e0b;
        }
        .toast-item.warning .toast-icon {
            color: #f59e0b;
        }
        .toast-item.info {
            border-left-color: #3b82f6;
        }
        .toast-item.info .toast-icon {
            color: #3b82f6;
        }

        @media (max-width: 500px) {
            .toast-container {
                top: 12px;
                right: 12px;
                left: 12px;
                max-width: none;
                width: auto;
            }
            .toast-item {
                padding: 12px 14px;
            }
        }

        /* ===== 编辑模态框 ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.25s ease;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: #ffffff;
            border-radius: 20px;
            padding: 28px 32px 32px;
            max-width: 560px;
            width: 92%;
            box-shadow: 0 20px 60px rgba(0, 20, 40, 0.3);
            animation: slideUp 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .modal h2 {
            font-size: 20px;
            font-weight: 700;
            color: #1a2b3c;
            margin-bottom: 6px;
        }
        .modal .subtitle {
            font-size: 14px;
            color: #6b7a8a;
            margin-bottom: 20px;
        }
        .modal .form-row {
            gap: 14px;
            margin-bottom: 4px;
        }
        .modal .form-group {
            flex: 1 1 80px;
        }
        .modal .form-group label {
            font-size: 13px;
            font-weight: 500;
            color: #3e4e5e;
        }
        .modal .form-group input {
            height: 42px;
            font-size: 14px;
        }
        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 24px;
        }
        .modal-actions .btn {
            padding: 8px 24px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .modal-actions .btn-primary {
            background: #3b82f6;
            color: #fff;
        }
        .modal-actions .btn-primary:hover {
            background: #2563eb;
        }
        .modal-actions .btn-secondary {
            background: #eef3f8;
            color: #3e4e5e;
        }
        .modal-actions .btn-secondary:hover {
            background: #dce6f0;
        }

        /* ===== 确认对话框 ===== */
        .confirm-modal {
            max-width: 420px;
        }
        .confirm-modal .confirm-icon {
            font-size: 40px;
            text-align: center;
            margin-bottom: 8px;
        }
        .confirm-modal .confirm-title {
            font-size: 18px;
            font-weight: 700;
            color: #1a2b3c;
            text-align: center;
            margin-bottom: 8px;
        }
        .confirm-modal .confirm-text {
            font-size: 14px;
            color: #4a5a6a;
            text-align: center;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .confirm-modal .confirm-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        .confirm-modal .confirm-actions .btn {
            padding: 9px 28px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .confirm-modal .confirm-actions .btn-danger {
            background: #dc2626;
            color: #fff;
        }
        .confirm-modal .confirm-actions .btn-danger:hover {
            background: #b91c1c;
        }
        .confirm-modal .confirm-actions .btn-secondary {
            background: #eef3f8;
            color: #3e4e5e;
        }
        .confirm-modal .confirm-actions .btn-secondary:hover {
            background: #dce6f0;
        }

        /* 隐藏文件输入 */
        #fileInput {
            display: none;
        }

        /* 滚动条 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #eef3f8;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #c8d6e4;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a8b8c8;
        }
    </style>
</head>
<body>

    <div class="app" id="app">
        <!-- 头部 -->
        <div class="header">
            <h1>
                ⚙️ 测试点配置生成器
                <small>for 洛谷</small>
            </h1>
            <span class="badge">📄 config.yml</span>
        </div>

        <!-- 全局设置 -->
        <div class="global-settings">
            <div class="setting-group name-format-group">
                <label>🏷️ 数据名称格式 <span style="color:#8a9aa8;font-weight:400;font-size:12px;">(支持变量)</span></label>
                <input type="text" id="globalNameFormat" value="data$fileId$" placeholder="例如: data$fileId$ 或 sub$taskId$_$caseId$" />
                <div class="format-hint">
                    点击插入：
                    <code data-var="$fileId$" title="全局测试点编号">$fileId$</code>
                    <code data-var="$taskId$" title="子任务编号">$taskId$</code>
                    <code data-var="$caseId$" title="子任务内序号">$caseId$</code>
                </div>
                <div class="format-preview" id="formatPreview"></div>
            </div>
            <div class="setting-group">
                <label>🏷️ subtask 起始编号</label>
                <input type="number" id="subtaskStart" value="1" min="0" step="1" />
            </div>
            <div style="flex:1; min-width:100px; display:flex; align-items:flex-end; gap:8px;">
                <button class="btn-outline" id="btnImport" style="height:40px;">📂 导入配置</button>
                <button class="btn-outline" id="btnExport" style="height:40px;">📤 导出配置</button>
                <input type="file" id="fileInput" accept=".json" />
            </div>
        </div>

        <!-- 添加子任务 -->
        <div class="form-card">
            <div class="form-title">
                ➕ 添加子任务
                <span>— 输入起始编号和该子任务包含的数据点个数</span>
            </div>
            <div class="form-row" id="formRow">
                <div class="form-group">
                    <label>起始编号 <span class="unit">(l)</span></label>
                    <input type="number" id="inputL" value="1" min="1" step="1" />
                </div>
                <div class="form-group">
                    <label>数据点个数 <span class="unit">(count)</span></label>
                    <input type="number" id="inputCount" value="10" min="1" step="1" />
                </div>
                <div class="form-group">
                    <label>分值 <span class="unit">(sc)</span></label>
                    <input type="number" id="inputSc" value="10" min="1" step="1" />
                </div>
                <div class="form-group">
                    <label>时间限制 <span class="unit">(ms)</span></label>
                    <input type="number" id="inputTl" value="1000" min="1" step="1" />
                </div>
                <div class="form-group">
                    <label>内存限制 <span class="unit">(MB)</span></label>
                    <input type="number" id="inputMl" value="256" min="1" step="1" />
                </div>
                <button class="btn-add" id="btnAdd">➕ 添加</button>
            </div>
        </div>

        <!-- 子任务列表 -->
        <div class="list-section">
            <div class="list-header">
                <div class="count">📋 已添加子任务 · <strong id="taskCount">0</strong> 个</div>
                <div class="list-actions">
                    <button class="btn-outline danger" id="btnClearAll">🗑️ 清空全部</button>
                    <button class="btn-primary" id="btnGenerate">🚀 生成配置文件</button>
                </div>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th style="width:30px;">#</th>
                            <th style="width:30px;">↕</th>
                            <th>起始 (l)</th>
                            <th>个数</th>
                            <th>范围</th>
                            <th>分值</th>
                            <th>时间 (ms)</th>
                            <th>内存 (MB)</th>
                            <th>文件名示例</th>
                            <th style="width:90px;">操作</th>
                        </tr>
                    </thead>
                    <tbody id="taskTableBody">
                        <tr class="empty-row">
                            <td colspan="10">暂无子任务，请添加</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 预览 -->
        <div class="preview-section hidden" id="previewSection">
            <div class="preview-header">
                <div class="label">📄 配置文件预览 <span>— config.yml</span></div>
                <div class="preview-actions">
                    <button class="btn-outline" id="btnCopy">📋 复制</button>
                    <button class="btn-success btn-primary" id="btnDownload">⬇️ 下载 config.yml</button>
                </div>
            </div>
            <textarea id="previewText" readonly placeholder="生成后这里将显示配置内容…"></textarea>
        </div>

        <div style="margin-top:22px;font-size:13px;color:#8a9aa8;text-align:center;border-top:1px solid #eef3f8;padding-top:18px;">
            生成的文件格式符合洛谷数据测试点规范 · 内存限制自动转换为 KB · 拖拽行手柄可调整子任务顺序 · 点击 ✎ 编辑子任务
        </div>
    </div>

    <!-- ===== 编辑模态框 ===== -->
    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <h2>✏️ 编辑子任务</h2>
            <div class="subtitle">修改当前子任务的配置项</div>
            <div class="form-row" style="gap:14px;">
                <div class="form-group">
                    <label>起始编号 <span class="unit">(l)</span></label>
                    <input type="number" id="editL" min="1" step="1" />
                </div>
                <div class="form-group">
                    <label>数据点个数 <span class="unit">(count)</span></label>
                    <input type="number" id="editCount" min="1" step="1" />
                </div>
                <div class="form-group">
                    <label>分值 <span class="unit">(sc)</span></label>
                    <input type="number" id="editSc" min="1" step="1" />
                </div>
                <div class="form-group">
                    <label>时间限制 <span class="unit">(ms)</span></label>
                    <input type="number" id="editTl" min="1" step="1" />
                </div>
                <div class="form-group">
                    <label>内存限制 <span class="unit">(MB)</span></label>
                    <input type="number" id="editMl" min="1" step="1" />
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="editCancel">取消</button>
                <button class="btn btn-primary" id="editSave">💾 保存</button>
            </div>
        </div>
    </div>

    <!-- ===== 确认对话框 ===== -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal confirm-modal">
            <div class="confirm-icon">⚠️</div>
            <div class="confirm-title" id="confirmTitle">确认操作</div>
            <div class="confirm-text" id="confirmText">确定要执行此操作吗？</div>
            <div class="confirm-actions">
                <button class="btn btn-secondary" id="confirmCancel">取消</button>
                <button class="btn btn-danger" id="confirmOk">确定</button>
            </div>
        </div>
    </div>

    <!-- ===== 右上角悬浮通知容器 ===== -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        (function() {
            'use strict';

            // ===== DOM refs =====
            const inputL = document.getElementById('inputL');
            const inputCount = document.getElementById('inputCount');
            const inputSc = document.getElementById('inputSc');
            const inputTl = document.getElementById('inputTl');
            const inputMl = document.getElementById('inputMl');
            const globalNameFormat = document.getElementById('globalNameFormat');
            const formatPreview = document.getElementById('formatPreview');
            const subtaskStart = document.getElementById('subtaskStart');
            const btnAdd = document.getElementById('btnAdd');
            const tbody = document.getElementById('taskTableBody');
            const taskCount = document.getElementById('taskCount');
            const btnClearAll = document.getElementById('btnClearAll');
            const btnGenerate = document.getElementById('btnGenerate');
            const previewSection = document.getElementById('previewSection');
            const previewText = document.getElementById('previewText');
            const btnCopy = document.getElementById('btnCopy');
            const btnDownload = document.getElementById('btnDownload');
            const btnExport = document.getElementById('btnExport');
            const btnImport = document.getElementById('btnImport');
            const fileInput = document.getElementById('fileInput');

            // 编辑模态框
            const editModal = document.getElementById('editModal');
            const editL = document.getElementById('editL');
            const editCount = document.getElementById('editCount');
            const editSc = document.getElementById('editSc');
            const editTl = document.getElementById('editTl');
            const editMl = document.getElementById('editMl');
            const editCancel = document.getElementById('editCancel');
            const editSave = document.getElementById('editSave');

            // 确认对话框
            const confirmModal = document.getElementById('confirmModal');
            const confirmTitle = document.getElementById('confirmTitle');
            const confirmText = document.getElementById('confirmText');
            const confirmCancel = document.getElementById('confirmCancel');
            const confirmOk = document.getElementById('confirmOk');

            // Toast
            const toastContainer = document.getElementById('toastContainer');

            // ===== State =====
            let tasks = [];
            let nextId = 1;
            let editingTaskId = null;
            let confirmCallback = null;

            // ===== Toast 通知 (右上角悬浮) =====
            function showToast(text, type, title) {
                type = type || 'info';
                const iconMap = {
                    success: '✅',
                    error: '❌',
                    warning: '⚠️',
                    info: '💡'
                };
                const titleMap = {
                    success: '成功',
                    error: '错误',
                    warning: '注意',
                    info: '提示'
                };
                const item = document.createElement('div');
                item.className = 'toast-item ' + type;
                item.innerHTML = `
                    <div class="toast-icon">${iconMap[type] || '💡'}</div>
                    <div class="toast-body">
                        <div class="toast-title">${escapeHtml(title || titleMap[type] || '提示')}</div>
                        <div class="toast-text">${escapeHtml(text)}</div>
                    </div>
                    <button class="toast-close" title="关闭">×</button>
                `;
                toastContainer.appendChild(item);

                // 关闭按钮
                item.querySelector('.toast-close').addEventListener('click', () => {
                    removeToast(item);
                });

                // 自动移除
                const duration = type === 'error' ? 5000 : (type === 'warning' ? 4500 : 3500);
                setTimeout(() => removeToast(item), duration);
                return item;
            }

            function removeToast(item) {
                if (!item || item._removing) return;
                item._removing = true;
                item.classList.add('removing');
                setTimeout(() => {
                    if (item.parentNode) item.parentNode.removeChild(item);
                }, 260);
            }

            // ===== 确认对话框 =====
            function showConfirm(title, text, onOk, okText) {
                confirmTitle.textContent = title;
                confirmText.textContent = text;
                confirmOk.textContent = okText || '确定';
                confirmCallback = onOk;
                confirmModal.classList.add('active');
            }

            function closeConfirm() {
                confirmModal.classList.remove('active');
                confirmCallback = null;
            }

            confirmCancel.addEventListener('click', closeConfirm);
            confirmOk.addEventListener('click', function() {
                if (typeof confirmCallback === 'function') {
                    confirmCallback();
                }
                closeConfirm();
            });
            confirmModal.addEventListener('click', function(e) {
                if (e.target === confirmModal) closeConfirm();
            });

            // ===== Helpers =====
            function getVal(input) {
                const v = parseInt(input.value.trim(), 10);
                return isNaN(v) ? null : v;
            }

            function getStr(input) {
                return input.value.trim();
            }

            function escapeHtml(s) {
                return String(s).replace(/[&<>"']/g, function(c) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
                });
            }

            /**
             * 校验 l + count 形式的输入
             * @returns {object|null} { l, r, count, sc, tl, ml }
             */
            function validateInputs(l, count, sc, tl, ml) {
                if (l === null || l < 1) {
                    showToast('起始编号必须为正整数', 'error');
                    return null;
                }
                if (count === null || count < 1) {
                    showToast('数据点个数必须为正整数', 'error');
                    return null;
                }
                if (sc === null || sc < 1) {
                    showToast('分值必须为正整数', 'error');
                    return null;
                }
                if (tl === null || tl < 1) {
                    showToast('时间限制必须为正整数', 'error');
                    return null;
                }
                if (ml === null || ml < 1) {
                    showToast('内存限制必须为正整数', 'error');
                    return null;
                }
                return { l, r: l + count - 1, count, sc, tl, ml };
            }

            // ===== 名称格式处理 =====
            function applyFormat(format, vars) {
                let result = format;
                result = result.split('$fileId$').join(String(vars.fileId));
                result = result.split('$taskId$').join(String(vars.taskId));
                result = result.split('$caseId$').join(String(vars.caseId));
                return result;
            }

            function calcFileId(taskIndex, caseIndex) {
                let count = 0;
                for (let i = 0; i < taskIndex; i++) {
                    count += tasks[i].count;
                }
                return count + caseIndex + 1;
            }

            function updateFormatPreview() {
                const fmt = getStr(globalNameFormat);
                if (!fmt) {
                    formatPreview.innerHTML = '<span style="color:#b0c0ce;">请输入格式，例如 data$fileId$</span>';
                    return;
                }
                const startTaskId = getVal(subtaskStart) !== null ? getVal(subtaskStart) : 1;

                let items = [];
                const maxShow = 2;
                if (tasks.length > 0) {
                    const t = tasks[0];
                    const count = Math.min(maxShow, t.count);
                    for (let i = 0; i < count; i++) {
                        const fId = calcFileId(0, i);
                        const tId = startTaskId + 0;
                        const cId = i + 1;
                        const n = applyFormat(fmt, { fileId: fId, taskId: tId, caseId: cId });
                        items.push({ n });
                    }
                } else {
                    items.push({ n: applyFormat(fmt, { fileId: 1, taskId: startTaskId, caseId: 1 }) });
                }

                let html = '';
                items.forEach((it, idx) => {
                    if (idx > 0) html += '<span style="color:#d4dee8;">·</span>';
                    html += `<span class="preview-item">
                        <span class="label">示例${idx+1}:</span>
                        <span class="val">${escapeHtml(it.n)}.in</span>
                        <span style="color:#b0c0ce;">/</span>
                        <span class="val out">${escapeHtml(it.n)}.out</span>
                    </span>`;
                });
                formatPreview.innerHTML = html;
            }

            // ===== Render Table =====
            function renderTable() {
                tbody.innerHTML = '';
                if (tasks.length === 0) {
                    tbody.innerHTML = `<tr class="empty-row"><td colspan="10">暂无子任务，请添加</td></tr>`;
                    taskCount.textContent = '0';
                    previewSection.classList.add('hidden');
                    updateFormatPreview();
                    return;
                }
                const fmt = getStr(globalNameFormat) || 'data$fileId$';
                const startTaskId = getVal(subtaskStart) !== null ? getVal(subtaskStart) : 1;

                tasks.forEach((t, idx) => {
                    const fileId = calcFileId(idx, 0);
                    const taskId = startTaskId + idx;
                    const caseId = 1;
                    const sampleName = applyFormat(fmt, { fileId, taskId, caseId });

                    const tr = document.createElement('tr');
                    tr.dataset.id = t.id;
                    tr.innerHTML = `
                        <td class="col-id">${idx + 1}</td>
                        <td class="col-drag">⠿</td>
                        <td>${t.l}</td>
                        <td>${t.count}</td>
                        <td><span class="cell-range">[${t.l}, ${t.l + t.count - 1}]</span></td>
                        <td>${t.sc}</td>
                        <td>${t.tl}</td>
                        <td>${t.ml}</td>
                        <td><span class="cell-fname" title="${escapeHtml(sampleName)}.in / ${escapeHtml(sampleName)}.out">${escapeHtml(sampleName)}.in</span></td>
                        <td class="col-actions">
                            <button class="btn-icon edit" data-id="${t.id}" title="编辑">✎</button>
                            <button class="btn-icon danger" data-id="${t.id}" title="删除">✕</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
                taskCount.textContent = tasks.length;

                tbody.querySelectorAll('.btn-icon.edit').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const id = parseInt(this.dataset.id, 10);
                        openEditModal(id);
                    });
                });
                tbody.querySelectorAll('.btn-icon.danger').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const id = parseInt(this.dataset.id, 10);
                        deleteTask(id);
                    });
                });

                initSortable();
                previewSection.classList.add('hidden');
                updateFormatPreview();
            }

            // ===== Sortable =====
            let sortableInstance = null;

            function initSortable() {
                if (sortableInstance) {
                    sortableInstance.destroy();
                    sortableInstance = null;
                }
                if (tasks.length < 2) return;
                sortableInstance = new Sortable(tbody, {
                    handle: '.col-drag',
                    animation: 150,
                    onEnd: function(evt) {
                        const oldIndex = evt.oldIndex;
                        const newIndex = evt.newIndex;
                        if (oldIndex === newIndex) return;
                        const moved = tasks.splice(oldIndex, 1)[0];
                        tasks.splice(newIndex, 0, moved);
                        renderTable();
                        showToast('子任务顺序已更新', 'info');
                    }
                });
            }

            // ===== CRUD =====
            function addTask() {
                const l = getVal(inputL);
                const count = getVal(inputCount);
                const sc = getVal(inputSc);
                const tl = getVal(inputTl);
                const ml = getVal(inputMl);
                const data = validateInputs(l, count, sc, tl, ml);
                if (!data) return;

                const { r } = data;
                // 重叠检查
                for (const t of tasks) {
                    const tR = t.l + t.count - 1;
                    if (Math.max(l, t.l) <= Math.min(r, tR)) {
                        showToast(`编号范围 [${l}, ${r}] 与已有子任务 [${t.l}, ${tR}] 重叠，请确认`, 'warning');
                        break;
                    }
                }

                tasks.push({
                    id: nextId++,
                    l,
                    count,
                    sc: data.sc,
                    tl: data.tl,
                    ml: data.ml
                });
                renderTable();
                showToast(`已添加子任务: [${l}, ${r}] · 共 ${count} 个数据点`, 'success');
                inputL.value = r + 1;
                inputCount.value = count;
                inputL.focus();
                inputL.select();
                previewSection.classList.add('hidden');
            }

            function deleteTask(id) {
                const task = tasks.find(t => t.id === id);
                if (!task) return;
                const r = task.l + task.count - 1;
                showConfirm(
                    '删除子任务',
                    `确定要删除子任务 [${task.l}, ${r}] (共 ${task.count} 个数据点) 吗？此操作不可恢复。`,
                    () => {
                        tasks = tasks.filter(t => t.id !== id);
                        renderTable();
                        if (tasks.length === 0) previewSection.classList.add('hidden');
                        showToast('子任务已删除', 'success');
                    },
                    '删除'
                );
            }

            function clearAll() {
                if (tasks.length === 0) return;
                showConfirm(
                    '清空全部子任务',
                    `确定要清空所有 ${tasks.length} 个子任务吗？此操作不可恢复。`,
                    () => {
                        tasks = [];
                        nextId = 1;
                        renderTable();
                        previewSection.classList.add('hidden');
                        showToast('已清空全部子任务', 'success');
                    },
                    '清空全部'
                );
            }

            // ===== 编辑模态框 =====
            function openEditModal(id) {
                const task = tasks.find(t => t.id === id);
                if (!task) return;
                editingTaskId = id;
                editL.value = task.l;
                editCount.value = task.count;
                editSc.value = task.sc;
                editTl.value = task.tl;
                editMl.value = task.ml;
                editModal.classList.add('active');
                setTimeout(() => editL.focus(), 100);
            }

            function closeEditModal() {
                editModal.classList.remove('active');
                editingTaskId = null;
            }

            function saveEdit() {
                if (editingTaskId === null) return;
                const l = getVal(editL);
                const count = getVal(editCount);
                const sc = getVal(editSc);
                const tl = getVal(editTl);
                const ml = getVal(editMl);
                const data = validateInputs(l, count, sc, tl, ml);
                if (!data) return;

                const { r } = data;
                for (const t of tasks) {
                    if (t.id === editingTaskId) continue;
                    const tR = t.l + t.count - 1;
                    if (Math.max(l, t.l) <= Math.min(r, tR)) {
                        showToast(`修改后的范围 [${l}, ${r}] 与子任务 [${t.l}, ${tR}] 重叠，请确认`, 'warning');
                    }
                }

                const task = tasks.find(t => t.id === editingTaskId);
                if (task) {
                    task.l = l;
                    task.count = count;
                    task.sc = data.sc;
                    task.tl = data.tl;
                    task.ml = data.ml;
                    renderTable();
                    showToast(`子任务已更新: [${l}, ${r}] · 共 ${count} 个数据点`, 'success');
                    closeEditModal();
                    previewSection.classList.add('hidden');
                }
            }

            editCancel.addEventListener('click', closeEditModal);
            editSave.addEventListener('click', saveEdit);
            editModal.addEventListener('click', function(e) {
                if (e.target === editModal) closeEditModal();
            });
            document.addEventListener('keydown', function(e) {
                if (editModal.classList.contains('active')) {
                    if (e.key === 'Escape') {
                        closeEditModal();
                        e.preventDefault();
                    } else if (e.key === 'Enter') {
                        saveEdit();
                        e.preventDefault();
                    }
                } else if (confirmModal.classList.contains('active')) {
                    if (e.key === 'Escape') {
                        closeConfirm();
                        e.preventDefault();
                    } else if (e.key === 'Enter') {
                        if (typeof confirmCallback === 'function') confirmCallback();
                        closeConfirm();
                        e.preventDefault();
                    }
                }
            });

            // ===== 生成 YAML =====
            function generateYAML() {
                if (tasks.length === 0) {
                    showToast('请先添加至少一个子任务', 'error');
                    return null;
                }
                const fmt = getStr(globalNameFormat) || 'data$fileId$';
                const start = getVal(subtaskStart);
                if (start === null || start < 0) {
                    showToast('subtask 起始编号必须为非负整数', 'error');
                    return null;
                }

                let lines = [];
                let fileIdCounter = 0;

                tasks.forEach((t, idx) => {
                    const subtaskId = start + idx;
                    for (let i = 0; i < t.count; i++) {
                        fileIdCounter++;
                        const caseId = i + 1;
                        const vars = {
                            fileId: fileIdCounter,
                            taskId: subtaskId,
                            caseId: caseId
                        };
                        const baseName = applyFormat(fmt, vars);
                        lines.push(baseName + '.in:');
                        lines.push('  timeLimit: ' + t.tl);
                        lines.push('  memoryLimit: ' + (t.ml * 1024));
                        lines.push('  score: ' + t.sc);
                        lines.push('  subtaskId: ' + subtaskId);
                    }
                });
                return lines.join('\n');
            }

            function showPreview(yaml) {
                if (!yaml) return;
                previewText.value = yaml;
                previewSection.classList.remove('hidden');
                previewSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }

            function handleGenerate() {
                const yaml = generateYAML();
                if (yaml) {
                    showPreview(yaml);
                    showToast('配置生成成功！', 'success');
                }
            }

            // ===== Copy & Download =====
            function handleCopy() {
                const text = previewText.value;
                if (!text) { showToast('没有内容可复制', 'error'); return; }
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(() => {
                        showToast('已复制到剪贴板', 'success');
                    }).catch(() => fallbackCopy(text));
                } else {
                    fallbackCopy(text);
                }
            }

            function fallbackCopy(text) {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                try {
                    document.execCommand('copy');
                    showToast('已复制到剪贴板', 'success');
                } catch (e) {
                    showToast('复制失败，请手动复制', 'error');
                }
                document.body.removeChild(ta);
            }

            function handleDownload() {
                const text = previewText.value;
                if (!text) { showToast('没有内容可下载', 'error'); return; }
                const blob = new Blob([text], { type: 'text/yaml;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'config.yml';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('config.yml 已下载', 'success');
            }

            // ===== Import / Export =====
            function exportConfig() {
                if (tasks.length === 0) {
                    showToast('没有子任务可导出', 'error');
                    return;
                }
                const data = {
                    version: '1.2',
                    nameFormat: getStr(globalNameFormat),
                    subtaskStart: getVal(subtaskStart) || 0,
                    tasks: tasks.map(({ id, l, count, sc, tl, ml }) => ({ id, l, count, sc, tl, ml }))
                };
                const json = JSON.stringify(data, null, 2);
                const blob = new Blob([json], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'task_config.json';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('配置已导出', 'success');
            }

            function importConfig(file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (!data.tasks || !Array.isArray(data.tasks)) {
                            showToast('无效的配置文件格式', 'error');
                            return;
                        }
                        // 兼容旧格式 (l, r) 转换为 (l, count)
                        tasks = data.tasks.map(t => {
                            let l = t.l;
                            let count;
                            if (typeof t.count === 'number') {
                                count = t.count;
                            } else if (typeof t.r === 'number') {
                                count = t.r - t.l + 1;
                            } else {
                                count = 1;
                            }
                            return {
                                id: nextId++,
                                l,
                                count,
                                sc: t.sc,
                                tl: t.tl,
                                ml: t.ml
                            };
                        });
                        if (data.nameFormat !== undefined) {
                            globalNameFormat.value = data.nameFormat;
                        } else if (data.prefix !== undefined) {
                            globalNameFormat.value = data.prefix ? data.prefix + '$fileId$' : 'data$fileId$';
                        }
                        if (data.subtaskStart !== undefined) subtaskStart.value = data.subtaskStart;
                        renderTable();
                        showToast(`成功导入 ${tasks.length} 个子任务`, 'success');
                        previewSection.classList.add('hidden');
                    } catch (err) {
                        showToast('导入失败: ' + err.message, 'error');
                    }
                };
                reader.readAsText(file);
            }

            // ===== 键盘添加 =====
            function onFormKeydown(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    btnAdd.click();
                }
            }

            // ===== 变量点击插入 =====
            function initVarChips() {
                document.querySelectorAll('.format-hint code[data-var]').forEach(code => {
                    code.addEventListener('click', function() {
                        const v = this.dataset.var;
                        const input = globalNameFormat;
                        const start = input.selectionStart;
                        const end = input.selectionEnd;
                        const val = input.value;
                        input.value = val.slice(0, start) + v + val.slice(end);
                        input.selectionStart = input.selectionEnd = start + v.length;
                        input.focus();
                        updateFormatPreview();
                        renderTable();
                    });
                });
            }

            // ===== Init =====
            function init() {
                btnAdd.addEventListener('click', addTask);
                btnClearAll.addEventListener('click', clearAll);
                btnGenerate.addEventListener('click', handleGenerate);
                btnCopy.addEventListener('click', handleCopy);
                btnDownload.addEventListener('click', handleDownload);
                btnExport.addEventListener('click', exportConfig);
                btnImport.addEventListener('click', () => fileInput.click());
                fileInput.addEventListener('change', function(e) {
                    if (this.files && this.files[0]) {
                        importConfig(this.files[0]);
                        this.value = '';
                    }
                });

                const inputs = [inputL, inputCount, inputSc, inputTl, inputMl];
                inputs.forEach(inp => {
                    inp.addEventListener('keydown', onFormKeydown);
                });

                globalNameFormat.addEventListener('input', function() {
                    updateFormatPreview();
                    renderTable();
                });
                subtaskStart.addEventListener('input', function() {
                    updateFormatPreview();
                    renderTable();
                });

                initVarChips();

                // 添加示例
                tasks.push({ id: nextId++, l: 1, count: 10, sc: 10, tl: 1000, ml: 256 });
                renderTable();
                inputL.value = 11;
                inputCount.value = 10;
                showToast('已添加一个示例子任务，可修改或添加更多', 'info');
            }

            init();
        })();
    </script>

</body>
</html>
